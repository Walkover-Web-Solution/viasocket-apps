name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch|minor|major   (bumps package.json and creates the tag)
#   git push --follow-tags
#
# No token: npm trusted publishing. npmjs.com → viasocket-apps → Settings → Trusted publishing names this
# repository and this file (release.yml), and npm accepts the run's OIDC identity instead of a secret, the
# same way the Python package publishes to PyPI. id-token: write is what lets the run prove who it is; it also
# signs the build's provenance. Trusted publishing needs npm 11.5.1 or later, hence the npm upgrade below.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm test
      # The tag and package.json must agree, or a stale tag would republish an old version.
      - name: Check the tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
