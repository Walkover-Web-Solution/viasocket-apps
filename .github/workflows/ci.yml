name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the floor (global WebCrypto without a flag); the others are what people run.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      # Builds ESM and CJS, then runs the suite against the built ESM output.
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      # One failing Python job leaves the others running, so every result is seen.
      fail-fast: false
      matrix:
        include:
          # 3.10 is the floor (LangChain 1 and CrewAI need it too), with no framework; the framework tests
          # (skipped where one is missing) run on 3.12.
          - python: '3.10'
            extras: ''
          - python: '3.12'
            extras: '[langchain,llamaindex]'
          - python: '3.12'
            extras: '[crewai]'
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install ".${{ matrix.extras }}"
      - run: python -m pytest
