[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "viasocket"
version = "0.1.0"
description = "viaSocket for Python agents: the 2,300+ apps each of your users connected (Slack, Google Sheets, HubSpot, Notion...) as tools for LangChain, CrewAI and LlamaIndex."
readme = "README.md"
license = "MIT"
authors = [{ name = "Walkover Web Solution" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["viasocket", "integrations", "ai-agent", "langchain", "crewai", "llamaindex", "tools", "slack", "google-sheets"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
llamaindex = ["llama-index-core>=0.12"]

[project.urls]
Homepage = "https://github.com/Walkover-Web-Solution/viasocket-apps/tree/main/python#readme"
Source = "https://github.com/Walkover-Web-Solution/viasocket-apps"

[tool.hatch.build.targets.wheel]
packages = ["src/viasocket"]
